name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      APP_NAME: AI Paceline
      BIN: AIPaceline
      ZIP: AIPaceline-macos-arm64.zip
    steps:
      - uses: actions/checkout@v7

      - name: Build the app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          swift build -c release --arch arm64
          BIN_DIR="$(swift build -c release --arch arm64 --show-bin-path)"
          APP="build/$APP_NAME.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BIN_DIR/$BIN" "$APP/Contents/MacOS/$BIN"
          cp Support/Info.plist "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Zip and checksum
        run: |
          ditto -c -k --keepParent "build/$APP_NAME.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install (Apple silicon, macOS 15 or later)

          1. Download \`$ZIP\` and unzip it.
          2. Move \`$APP_NAME.app\` to \`~/Applications\` or \`/Applications\`.
          3. The app is ad-hoc signed, not notarized. Remove the quarantine flag once, then open it:

          \`\`\`sh
          xattr -dr com.apple.quarantine ~/Applications/"$APP_NAME.app"
          \`\`\`

          Checksum: \`$(cut -d' ' -f1 "$ZIP.sha256")\` (also in \`$ZIP.sha256\`).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "$APP_NAME $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
