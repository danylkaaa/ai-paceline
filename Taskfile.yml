version: "3"

vars:
  APP: build/AI Paceline.app
  INSTALLED: "{{.HOME}}/Applications/AI Paceline.app"

tasks:
  build:
    desc: Build the app bundle into build/
    cmds:
      - swift build -c release --quiet
      - rm -rf "{{.APP}}" && mkdir -p "{{.APP}}/Contents/MacOS"
      - cp .build/release/AIPaceline "{{.APP}}/Contents/MacOS/AIPaceline"
      - cp Support/Info.plist "{{.APP}}/Contents/Info.plist"
      - codesign --force --sign - "{{.APP}}" 2>/dev/null

  run:
    desc: Build and start the app from build/
    deps: [build]
    cmds:
      - pkill -x AIPaceline || true
      - open "{{.APP}}"

  install:
    desc: Build and install into ~/Applications, then start it
    deps: [build]
    cmds:
      - pkill -x AIPaceline || true
      - rm -rf "{{.INSTALLED}}"
      - cp -R "{{.APP}}" "{{.INSTALLED}}"
      - open "{{.INSTALLED}}"

  test:
    desc: Run unit tests
    cmds:
      # The Command Line Tools do not pass the Swift Testing macro plugin to the compiler by themselves.
      - swift test --quiet -Xswiftc -plugin-path -Xswiftc /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing

  snapshot:
    desc: Render each panel tab with real data into build/snapshots
    deps: [build]
    cmds:
      - '"{{.APP}}/Contents/MacOS/AIPaceline" --snapshot build/snapshots'

  screenshots:
    desc: Capture every panel in light and dark mode with demo data into docs/screenshots
    deps: [build]
    cmds:
      - |
        set -e
        out=docs/screenshots; mkdir -p "$out"; log=$(mktemp)
        pkill -x AIPaceline || true
        for look in light dark; do
          for view in overview claude codex settings; do
            "{{.APP}}/Contents/MacOS/AIPaceline" --demo --open "$view" --appearance "$look" -AppleLocale en_US -AppleLanguages "(en)" > "$log" 2>&1 &
            sleep 4
            if ! grep -q 'visible=true' "$log"; then
              pkill -x AIPaceline; echo "The menu bar is too full: the app icon is hidden. Quit some menu bar apps and retry."; exit 1
            fi
            screencapture -x -l"$(awk '/panel-window/{print $2}' "$log")" "$out/$view-$look.png"
            pkill -x AIPaceline; sleep 1
          done
        done
        snap=$(mktemp -d)
        "{{.APP}}/Contents/MacOS/AIPaceline" --demo --snapshot "$snap" -AppleLocale en_US -AppleLanguages "(en)" > /dev/null 2>&1
        cp "$snap"/menubar-*.png "$out"/
        echo "Saved to $out"
